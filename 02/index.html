<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipping Credit Card - CodingLab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <div class="credit-card">
            
            <div class="card-face front">
                <header>
                    <span class="logo">
                        <svg width="48" height="48" viewBox="0 0 24 24">
                            <circle cx="7" cy="12" r="7" fill="#eb001b" opacity="0.9"/>
                            <circle cx="17" cy="12" r="7" fill="#ff5f00" opacity="0.9"/>
                        </svg>
                        <h5>MasterCard</h5>
                    </span>
                    <img src="https://raw.githubusercontent.com/sefyudem/Responsive-Credit-Card-Form/master/img/chip.png" alt="Chip" class="chip">
                </header>

                <div class="card-details">
                    <div class="number-box">
                        <h6>Número do Cartão</h6>
                        <h5 class="number">5234 6578 9012 3456</h5>
                    </div>
                    
                    <div class="bottom-details">
                        <div class="name-box">
                            <h6>Titular do Cartão</h6>
                            <h5 class="name">PREM KUMAR SHAHI</h5>
                        </div>
                        <div class="date-box">
                            <h6>Validade</h6>
                            <h5 class="date">12/30</h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-face back">
                <div class="magnetic-strip"></div>
                
                <div class="signature-cvv">
                    <h6>Signature</h6>
                    <div class="signature-bar">
                        <span class="cvv-number">123</span>
                    </div>
                </div>

                <div class="back-content">
                    <p>Este cartão é de uso pessoal e intransferível. Em caso de perda ou roubo, comunique imediatamente à central de atendimento do banco emissor.</p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
